name: Build Multi-Arch Images

on:
  push:
    branches: [ "main" ]

jobs:
  build-images:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出你的代码 (使用官方标准的 v4)
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 QEMU (这是用于模拟 ARM/Mac 芯片的关键)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. 配置 Buildx 工具 (使用官方模板中的 v3 版本)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # --- 构建 amd64 专用包 ---
      - name: Build & Export AMD64
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          tags: iptv-server:amd64
          outputs: type=docker,dest=/tmp/iptv-server-amd64.tar

      # --- 构建 arm64 专用包 ---
      - name: Build & Export ARM64
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/arm64
          tags: iptv-server:arm64
          outputs: type=docker,dest=/tmp/iptv-server-arm64.tar

      # --- 构建通用包 (Universal) ---
      - name: Build & Export Universal
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: iptv-server:universal
          outputs: type=docker,dest=/tmp/iptv-server-universal.tar

      # --- 上传产物供下载 ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iptv-server-all-packs
          path: |
            /tmp/iptv-server-amd64.tar
            /tmp/iptv-server-arm64.tar
            /tmp/iptv-server-universal.tar